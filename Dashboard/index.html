<!DOCTYPE html>
<html>
<head>
    <title>Smart Home Energy Saver Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>IoT-Based Smart Home Energy Saver System</h1>

    <div class="card">
        <h2>Motion Status</h2>
        <p id="motion">No Motion Detected</p>
    </div>

    <div class="card">
        <h2>Light Status</h2>
        <p id="light">OFF</p>
    </div>

    <div class="card">
    <h2>Room Occupancy</h2>
    <p>Empty</p>
</div>

<div class="card">
    <h2>Last Activity</h2>
    <p>No Activity</p>
</div>

    <div class="card">
        <h2>Energy Saved</h2>
        <p>0 Units</p>
    </div>

    <div class="card">
        <h2>Energy Wastage Alert</h2>
        <p>No Alerts</p>
    </div>

<script src="script.js"></script>

</body>
</html>
